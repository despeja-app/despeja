name: 🧪 Lo probé en mi equipo / I tested it on my device
description: Cuéntanos cómo le fue a Despeja en tu sistema. / Tell us how Despeja did on your system.
labels: [probar]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias! Probar en un equipo de verdad es de las ayudas que más sirven.
        Usa solo datos ficticios. / Thanks! Testing on a real device is one of the most useful things you can do. Fictional data only.
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema / System
      options: [Mac, iPhone, Otro / Other]
    validations: { required: true }
  - type: input
    id: detalle
    attributes:
      label: Versión del sistema y cómo instalaste / OS version and how you installed
      placeholder: macOS 15 · instalar.sh
    validations: { required: true }
  - type: checkboxes
    id: revisado
    attributes:
      label: Lo que funcionó / What worked
      options:
        - label: Se instaló y abrió (y el aviso de app sin firmar fue claro) / It installed and opened (and the unsigned-app warning was clear)
        - label: Lo primero fue elegir el idioma / The first thing was choosing the language
        - label: El Mac vio el iPhone (por cable y por Wi-Fi) / The Mac saw the iPhone (via cable and Wi-Fi)
        - label: Las apps aparecieron con su tamaño / The apps showed up with their size
        - label: El respaldo terminó y las fotos quedaron en la carpeta / The backup finished and the photos were in the folder
        - label: «Borrar del iPhone» borró solo lo respaldado / “Delete from iPhone” deleted only what was backed up
        - label: Tu IA armó un plan con sentido / Your AI made a sensible plan
  - type: textarea
    id: problemas
    attributes:
      label: Lo que falló o se vio raro (capturas bienvenidas) / What failed or looked odd (screenshots welcome)
